<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Pass - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://cdn.jsdelivr.net/npm/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif; /* Using a common modern sans-serif font */
            background-color: #0f172a; /* Darker blue-gray background */
            color: #e2e8f0; /* Light gray text */
            margin: 0;
            padding: 0;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0; /* Behind content */
        }

        .container {
            position: relative; /* To stay above particles */
            z-index: 1;
            max-width: 1200px;
            margin: 40px auto;
            padding: 30px;
            background-color: rgba(15, 23, 42, 0.8); /* Semi-transparent dark bg */
            backdrop-filter: blur(10px); /* Frosted glass effect */
            border: 1px solid #334155; /* Subtle border */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border-radius: 12px;
        }

        .card {
            background-color: #1e293b; /* Slightly lighter dark blue-gray */
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            border: 1px solid #334155;
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            margin-bottom: 15px;
            color: #94a3b8; /* Lighter gray heading */
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

         .card h2 ion-icon {
            font-size: 1.4rem;
         }

        .card p {
            font-size: 2rem; /* Larger count */
            font-weight: 700;
            color: #f1f5f9; /* Almost white */
            margin-top: auto; /* Push count to bottom if card height varies */
        }

        .button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.3s ease, transform 0.1s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .button:active {
             transform: scale(0.98);
        }

        .button ion-icon {
            font-size: 1.2em;
        }

        .add-button {
            background-color: #6366f1; /* Indigo */
            color: white;
        }

        .sync-button {
            background-color: #0ea5e9; /* Sky Blue */
            color: white;
        }
        .sync-button:disabled {
             background-color: #334155;
             cursor: not-allowed;
             color: #64748b;
        }

        .add-button:hover {
            background-color: #4f46e5; /* Darker Indigo */
        }

        .sync-button:hover:not(:disabled) {
            background-color: #0284c7; /* Darker Sky Blue */
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 100; /* High z-index */
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px); /* Blur background */
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
         @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .modal.fade-out {
            animation: fadeOut 0.3s ease-out forwards;
        }


        .modal-content {
            background-color: #1e293b; /* Match card background */
            color: #e2e8f0;
            margin: 10% auto; /* More vertical centering */
            padding: 30px;
            border: 1px solid #334155;
            width: 90%;
            max-width: 500px; /* Max width */
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
             from { transform: translateY(-30px); opacity: 0; }
             to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #334155;
        }

        .modal-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #f1f5f9;
        }

        .close-button {
            color: #94a3b8;
            background: none;
            border: none;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
            padding: 0;
            transition: color 0.2s ease;
        }

        .close-button:hover,
        .close-button:focus {
            color: #f1f5f9; /* White on hover */
        }

        .modal-body input[type="text"],
        .modal-body textarea,
        .modal-body input[type="file"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0 15px 0; /* Added bottom margin */
            box-sizing: border-box;
            background-color: #334155; /* Darker input background */
            color: #e2e8f0;
            border: 1px solid #475569; /* Slightly lighter border */
            border-radius: 6px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .modal-body input[type="text"]:focus,
        .modal-body textarea:focus {
            outline: none;
            border-color: #6366f1; /* Indigo border on focus */
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
        }


        .modal-body textarea {
            resize: vertical;
            min-height: 120px;
        }

        .modal-body input[type="file"] {
            color: #94a3b8;
            padding: 10px 0; /* Adjust padding */
        }
        .modal-body input::file-selector-button { /* Style the file input button */
            padding: 8px 15px;
            margin-right: 10px;
            border-radius: 4px;
            background-color: #6366f1;
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .modal-body input::file-selector-button:hover {
             background-color: #4f46e5;
        }

        .modal-footer {
            margin-top: 25px;
            text-align: right; /* Align button to the right */
        }

        /* Feedback Area */
        #feedback-area {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none; /* Hidden by default */
            font-weight: 500;
            animation: fadeIn 0.5s;
        }
        #feedback-area.success {
            background-color: #10b981; /* Emerald-500 */
            color: #f0fdf4; /* Emerald-50 */
            display: block;
        }
        #feedback-area.error {
            background-color: #f43f5e; /* Rose-500 */
            color: #fff1f2; /* Rose-50 */
            display: block;
        }

        /* Spinner for Sync Button */
        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            width: 16px;
            height: 16px;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px; /* Space between spinner and text */
        }

        @keyframes spin {
          to { transform: rotate(360deg); }
        }

    </style>
</head>

<body class="bg-gray-900">
    <div id="particles-js"></div>
    <div class="container mx-auto px-4">
        <h1 class="text-4xl font-bold mb-8 text-center text-indigo-300">Admin Dashboard</h1>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="card">
                <h2><ion-icon name="briefcase-outline"></ion-icon>Job Nodes</h2>
                <p id="job-count">0</p>
            </div>
            <div class="card">
                <h2><ion-icon name="school-outline"></ion-icon>Course Nodes</h2>
                <p id="course-count">0</p>
            </div>
            <div class="card">
                <h2><ion-icon name="sparkles-outline"></ion-icon>Skill Nodes</h2>
                <p id="skill-count">0</p>
            </div>
        </div>

        <div class="flex flex-wrap justify-center gap-4 mb-8">
            <button class="button add-button" onclick="openModal('addCourseModal')">
                <ion-icon name="add-circle-outline"></ion-icon>Add New Course
            </button>
            <button class="button add-button" onclick="openModal('addJobModal')">
                 <ion-icon name="add-circle-outline"></ion-icon>Add New Job
            </button>
            <button class="button sync-button" id="sync-button" onclick="compileAndSyncData()">
                <span id="sync-spinner" class="hidden spinner"></span> <ion-icon name="sync-outline" id="sync-icon"></ion-icon> <span id="sync-text">Compile & Sync Data</span>
            </button>
        </div>

         <div id="feedback-area"></div>

    </div> <div id="addCourseModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                 <h2><ion-icon name="school-outline"></ion-icon>Add New Course</h2>
                 <button class="close-button" onclick="closeModal('addCourseModal')">&times;</button>
            </div>
            <div class="modal-body">
                <label for="courseName" class="block mb-1 font-semibold text-gray-400">Course Name <span class="text-red-500">*</span></label>
                <input type="text" id="courseName" placeholder="e.g., Introduction to Python" required>

                <label for="courseDescription" class="block mb-1 font-semibold text-gray-400">Course Description <span class="text-red-500">*</span></label>
                <textarea id="courseDescription" placeholder="Detailed description of the course content and objectives..." required></textarea>

                <label for="courseImage" class="block mb-1 font-semibold text-gray-400">Course Image</label>
                <input type="file" id="courseImage" accept="image/*">
            </div>
             <div class="modal-footer">
                <button class="button add-button" onclick="addNewCourse()">
                     <ion-icon name="add-outline"></ion-icon>Add Course
                 </button>
             </div>
        </div>
    </div>

    <div id="addJobModal" class="modal">
        <div class="modal-content">
             <div class="modal-header">
                <h2><ion-icon name="briefcase-outline"></ion-icon>Add New Job</h2>
                <button class="close-button" onclick="closeModal('addJobModal')">&times;</button>
            </div>
             <div class="modal-body">
                <label for="jobName" class="block mb-1 font-semibold text-gray-400">Job Title <span class="text-red-500">*</span></label>
                <input type="text" id="jobName" placeholder="e.g., Software Engineer" required>

                <label for="jobDescription" class="block mb-1 font-semibold text-gray-400">Job Description <span class="text-red-500">*</span></label>
                <textarea id="jobDescription" placeholder="Detailed description of the job responsibilities and requirements..." required></textarea>

                <label for="jobImage" class="block mb-1 font-semibold text-gray-400">Associated Image (Optional)</label>
                <input type="file" id="jobImage" accept="image/*">
            </div>
            <div class="modal-footer">
                <button class="button add-button" onclick="addNewJob()">
                    <ion-icon name="add-outline"></ion-icon>Add Job
                </button>
            </div>
        </div>
    </div>


    <script>
        // --- Constants ---
        const API_BASE_URL = "http://127.0.0.1:8081";
        const SYNC_ENDPOINT = `${API_BASE_URL}/compile_graph`;
        const INFO_ENDPOINT = `${API_BASE_URL}/get_graph_info`;

        const ADD_COURSE_ENDPOINT = `${API_BASE_URL}/add_course_cluster`;
        const ADD_JOB_ENDPOINT = `${API_BASE_URL}/add_job_cluster`;

        // --- DOM Elements ---
        const jobCountEl = document.getElementById("job-count");
        const courseCountEl = document.getElementById("course-count");
        const skillCountEl = document.getElementById("skill-count");
        const feedbackArea = document.getElementById("feedback-area");
        const syncButton = document.getElementById("sync-button");
        const syncSpinner = document.getElementById("sync-spinner");
        const syncIcon = document.getElementById("sync-icon");
        const syncText = document.getElementById("sync-text");

        // --- Modal Elements ---
        const addCourseModal = document.getElementById("addCourseModal");
        const addJobModal = document.getElementById("addJobModal");
        const courseNameInput = document.getElementById("courseName");
        const courseDescInput = document.getElementById("courseDescription");
        const courseImageInput = document.getElementById("courseImage");
        const jobNameInput = document.getElementById("jobName");
        const jobDescInput = document.getElementById("jobDescription");
        const jobImageInput = document.getElementById("jobImage");


        // --- Particles.js Config ---
        particlesJS('particles-js', {
             "particles": {
                "number": { "value": 120, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#4f46e5" },
                "shape": { "type": "circle", "stroke": { "width": 0, "color": "#000000" }, "polygon": { "nb_sides": 5 } },
                "opacity": { "value": 0.4, "random": false, "anim": { "enable": false, "speed": 1, "opacity_min": 0.1, "sync": false } },
                "size": { "value": 3, "random": true, "anim": { "enable": false, "speed": 40, "size_min": 0.1, "sync": false } },
                "line_linked": { "enable": true, "distance": 150, "color": "#334155", "opacity": 0.3, "width": 1 }, // Adjusted line color
                "move": { "enable": true, "speed": 4, "direction": "none", "random": true, "straight": false, "out_mode": "out", "attract": { "enable": false, "rotateX": 600, "rotateY": 1200 } }
            },
            "interactivity": {
                 "detect_on": "canvas", "events": { "onhover": { "enable": true, "mode": "grab" }, "onclick": { "enable": true, "mode": "push" }, "resize": true }, "modes": { "grab": { "distance": 140, "line_linked": { "opacity": 0.7 } }, "bubble": { "distance": 400, "size": 40, "duration": 2, "opacity": 8, "speed": 3 }, "repulse": { "distance": 200, "duration": 0.4 }, "push": { "particles_nb": 4 }, "remove": { "particles_nb": 2 } }
            }, "retina_detect": true
         });


        // --- Modal Handling ---
        function openModal(modalId) {
            const modal = document.getElementById(modalId);
            if (!modal) return;

            // Clear inputs when opening
            if (modalId === 'addCourseModal') {
                courseNameInput.value = "";
                courseDescInput.value = "";
                courseImageInput.value = ""; // Clear file input
            } else if (modalId === 'addJobModal') {
                jobNameInput.value = "";
                jobDescInput.value = "";
                jobImageInput.value = ""; // Clear file input
            }

            modal.style.display = "block";
            modal.classList.remove('fade-out'); // Ensure fade-in animation runs
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
             if (!modal) return;
            modal.classList.add('fade-out');
            // Wait for fade-out animation to complete before hiding
            setTimeout(() => {
                 modal.style.display = "none";
                 modal.classList.remove('fade-out'); // Reset class for next time
            }, 300); // Match animation duration
        }

        // Close modal if clicking outside the content
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                if (event.target.id === 'addCourseModal') closeModal('addCourseModal');
                if (event.target.id === 'addJobModal') closeModal('addJobModal');
            }
        }

        // --- Feedback Display ---
        function showFeedback(message, type = 'success') {
            feedbackArea.textContent = message;
            feedbackArea.className = type; // 'success' or 'error'
             // Automatically hide after 5 seconds
            setTimeout(() => {
                feedbackArea.style.display = 'none';
                feedbackArea.className = ''; // Reset class
            }, 5000);
        }

        // --- API Calls ---

        async function addNewCourse() {
            const name = courseNameInput.value.trim();
            const description = courseDescInput.value.trim();
            const imageFile = courseImageInput.files[0];

             if (!name || !description) {
                 showFeedback("Course Name and Description are required.", "error");
                 return;
             }

            const formData = new FormData();
            formData.append('name', name);
            formData.append('description', description);
            if (imageFile) {
                 formData.append('image', imageFile);
            }

            showFeedback("Adding course...", "info");

            try {
                const response = await fetch(ADD_COURSE_ENDPOINT, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    let errorDetail = `HTTP error! Status: ${response.status}`;
                     try {
                        const errorData = await response.json();
                        errorDetail = errorData.detail || JSON.stringify(errorData);
                    } catch (e) {
                        errorDetail = `${errorDetail} - ${response.statusText}`;
                    }
                    throw new Error(errorDetail);
                }

                const result = await response.json();
                console.log("Course added response:", result);
                showFeedback(result.message || "Course added successfully!", "success");
                closeModal('addCourseModal');
                updateGraphInfo();

            } catch (error) {
                console.error("Error adding course:", error);
                showFeedback(`Error adding course: ${error.message}`, "error");
            } finally {
            }
        }

        async function addNewJob() {
            const name = jobNameInput.value.trim();
            const description = jobDescInput.value.trim();
            const imageFile = jobImageInput.files[0];

            if (!name) {
                showFeedback("Job Title is required.", "error");
                return;
            }

            const formData = new FormData();
            formData.append('name', name);
            if (description) {
                 formData.append('description', description); 
            }
            if (imageFile) {
                formData.append('image', imageFile); 
            }

            showFeedback("Adding job...", "info"); 

            try {
                const response = await fetch(ADD_JOB_ENDPOINT, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    let errorDetail = `HTTP error! Status: ${response.status}`;
                    try {
                        const errorData = await response.json();
                        errorDetail = errorData.detail || JSON.stringify(errorData);
                    } catch (e) {
                         errorDetail = `${errorDetail} - ${response.statusText}`;
                    }
                    throw new Error(errorDetail);
                }

                const result = await response.json();
                console.log("Job added response:", result);
                showFeedback(result.message || "Job added successfully!", "success");
                closeModal('addJobModal');
                updateGraphInfo();

            } catch (error) {
                console.error("Error adding job:", error);
                showFeedback(`Error adding job: ${error.message}`, "error");
            } finally {
            }
        }

        // Compile and Sync Data
        async function compileAndSyncData() {
            // --- Start Loading State ---
            syncButton.disabled = true;
            syncSpinner.classList.remove("hidden");
            syncIcon.classList.add("hidden"); // Hide the regular icon
            syncText.textContent = "Syncing...";
            feedbackArea.style.display = 'none'; // Clear previous feedback
            // --- End Loading State ---

            try {
                const response = await fetch(SYNC_ENDPOINT, { method: 'GET' });

                if (!response.ok) {
                    // Try to get error details from the server response
                    let errorDetail = response.statusText;
                    try {
                        const errorData = await response.json();
                        errorDetail = errorData.detail || JSON.stringify(errorData);
                    } catch (e) {
                         // Ignore if response is not JSON
                    }
                    throw new Error(`HTTP error! Status: ${response.status}, Message: ${errorDetail}`);
                }

                const data = await response.json(); // Assuming API returns JSON confirmation
                console.log('Graph compiled and synced:', data);
                showFeedback("Graph compiled and synced successfully!", "success");
                 updateGraphInfo(); // Update counts after successful sync might be useful

            } catch (error) {
                console.error('Error compiling and syncing graph:', error);
                showFeedback(`Error syncing graph: ${error.message}`, "error");
            } finally {
                 // --- Reset Button State ---
                 syncButton.disabled = false;
                 syncSpinner.classList.add("hidden");
                 syncIcon.classList.remove("hidden"); // Show the regular icon
                 syncText.textContent = "Compile & Sync Data";
                // --- End Reset Button State ---
            }
        }

        // Fetch Graph Info and Update UI
        async function updateGraphInfo() {
             console.log("Fetching graph info from:", INFO_ENDPOINT); // Debug log
            try {
                const response = await fetch(INFO_ENDPOINT);
                if (!response.ok) {
                     let errorDetail = response.statusText;
                    try {
                         const errorData = await response.json();
                         errorDetail = errorData.detail || JSON.stringify(errorData);
                    } catch (e) { /* Ignore */ }
                    throw new Error(`Failed to fetch graph info: ${response.status} - ${errorDetail}`);
                }
                const data = await response.json();
                console.log("Received graph info:", data);

                // Update the counts in the UI
                jobCountEl.textContent = data.n_job ?? "N/A"; // Use nullish coalescing for safety
                courseCountEl.textContent = data.n_course ?? "N/A";
                skillCountEl.textContent = data.n_skill ?? "N/A";

            } catch (error) {
                console.error("Error fetching graph information:", error);
                // Display error in the UI cards
                jobCountEl.textContent = "Error";
                courseCountEl.textContent = "Error";
                skillCountEl.textContent = "Error";
                 showFeedback(`Error fetching graph data: ${error.message}`, "error");
            }
        }

        // --- Initial Load ---
        window.onload = updateGraphInfo;

    </script>

</body>
</html>
